[project]
name = "click-tracker"
version = "0.1.0"
description = "Click tracker"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.5.8",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=24.0.0",
    "structlog-pretty>=0.4.3",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
load = [
    "locust>=2.36.0",
]
test = [
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
    "httpx>=0.28.0",
    "nest-asyncio>=1.6.0",
    "polyfactory>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "dbmodels"]
