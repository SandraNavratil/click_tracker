# CI workflow – 3 stages: precommit → build → test
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_TAG: click-tracker:ci

jobs:
  # ─── Stage: static-analysis ─────────────────────────────────────────────
  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # ─── Stage: build ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [precommit]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (with test deps for test stage)
        run: |
          docker build \
            --build-arg INSTALL_TEST_DEPS=1 \
            -t ${{ env.IMAGE_TAG }} .

      - name: Export image
        run: docker save ${{ env.IMAGE_TAG }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  # ─── Stage: test ────────
  dbmodels_test:
    name: Test · dbmodels
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:14.4-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: click_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DB_URL: postgresql+asyncpg://user:password@localhost:5432/click_tracker
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      - run: |
          docker run --rm --network host \
            -e DB_URL="${{ env.DB_URL }}" \
            -e ENVIRONMENT="${{ env.ENVIRONMENT }}" \
            ${{ env.IMAGE_TAG }} \
            uv run python -m pytest -vv --asyncio-mode=auto \
              --color=yes --showlocals ./dbmodels
